plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'maven-publish'
}

def bhComponents = [
    'articles',
    'articleswlp',
    'carousel',
    'moodbottomdialog',
    'settings',
    'share',
]

def bhWidgets = [
    'bottomnavigation',
    'button',
    'banner',
    'moodselector',
    'card',
    'carousel',
    'checkbox',
    'pager',
    'radiobutton',
    'textfield',
]

android {
    compileSdk 34

    sourceSets.main {
        bhComponents.forEach {
            res.srcDirs += "src/main/java/com/phe/betterhealth/components/" + it + "/res"
        }
        bhWidgets.forEach {
            res.srcDirs += "src/main/java/com/phe/betterhealth/widgets/" + it + "/res"
        }
    }

    namespace 'com.phe.betterhealth.widgets'
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        dataBinding true
        buildConfig false
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'io.coil-kt:coil:2.6.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
}

tasks.register('androidSourcesJar', Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.phe.betterhealth'
            artifactId = 'ui-components'
            version = "1.4.0-SNAPSHOT"

            afterEvaluate {
                from components.release
            }
        }
    }
}
